[package]
name = "siralos-godot"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Godot domain — standalone Plugin crate behind siralos:domain-abi@1.0.0 (extracted from Siralos monorepo per decisions 34/37/61). Re-exports the 6+3 R8/R9 host-owned surfaces; monorepo pins this crate via git rev + Cargo.lock (decision 61 C3)."

[dependencies]
siralos-core = { path = "../siralos/crates/siralos-core", version = "0.0.0" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
